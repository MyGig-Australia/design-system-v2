  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

============\n     COLORS\n     ---------------------------------------------------------------------\n     The MyGig palette is built around three commitments:\n     1.  INK    — deep, off-true black for primary surfaces, text, branding.\n                  Borrowed straight from the wordmark. Never pure #000.\n     2.  BRAND  — the signature MyGig violet. Used for primary CTAs,\n                  selection, key status, and brand moments. Pulled from\n                  mygig.com.au. Used confidently — not sparingly — because\n                  it IS the brand colour. White text reads on the 500.\n     3.  PAPER  — warm off-white background that lets ink + brand breathe.\n                  Cooler greys feel corporate; PAPER feels like a worksite\n                  notice / handwritten timesheet.\n     ===================================================================== */\n\n  /* Core scale — INK (neutrals) */\n  --ink-0:    #FAF8F4;  /* paper, app background */\n  --ink-50:   #F2EFE8;  /* subtle surface, hover */\n  --ink-100:  #E5E1D7;  /* divider, input border */\n  --ink-200:  #CFC9BA;  /* disabled stroke */\n  --ink-300:  #A8A294;  /* placeholder text */\n  --ink-400:  #6F6A60;  /* secondary text */\n  --ink-500:  #3D3A33;  /* body text on paper */\n  --ink-700:  #1F1D19;  /* near-black */\n  --ink-900:  #0E0D0B;  /* the wordmark black — never #000 */\n\n  /* Core scale — BRAND (signature violet) */\n  --brand-50:  #F5F4FE;  /* hover-on-paper, faint tint */\n  --brand-100: #E8E6F9;  /* badge background, info chip (from mygig.com.au) */\n  --brand-200: #DBD8FA;  /* secondary fill (from mygig.com.au) */\n  --brand-300: #B8B1F7;  /* tertiary fill, links-on-tint */\n  --brand-500: #6C60FF;  /* THE brand violet (from mygig.com.au) */\n  --brand-700: #4B3FD9;  /* pressed/active state */\n  --brand-900: #2D2580;  /* brand text on light bg */\n\n  /* Surface scale — PURE (white surfaces, cards) */\n  --surface-0:    #FFFFFF;  /* card, modal */\n  --surface-1:    #FAF8F4;  /* = ink-0 */\n  --surface-2:    #F2EFE8;\n  --surface-inverse: var(--ink-900);\n\n  /* Semantic — compliance + status */\n  --success-50:  #E8F6EE;\n  --success-500: #1F8A4C;  /* shift confirmed, paid, on-time */\n  --success-700: #135E33;\n\n  --warn-50:  #FFF3DC;\n  --warn-500: #E89B14;     /* expiring cert, unread shift */\n  --warn-700: #8A5A00;\n\n  --danger-50:  #FCE7E4;\n  --danger-500: #D03826;   /* no-show, cancellation, error */\n  --danger-700: #821F12;\n\n  --info-50:  #E4ECF7;\n  --info-500: #2563C8;     /* tooltips, compliance notes */\n  --info-700: #173E80;\n\n  /* Industry accent tints (used for category tagging — NEVER for chrome) */\n  --tag-hospo:        #FFD6A8;  /* hospitality */\n  --tag-events:       #F2C9FF;  /* events */\n  --tag-warehouse:    #B8E2FF;  /* warehousing / logistics */\n  --tag-construction: #FFDF6B;  /* construction */\n  --tag-retail:       #F6B8C8;  /* retail */\n  --tag-mining:       #C3D3A6;  /* mining */\n  --tag-agriculture:  #C9E8C2;  /* agriculture */\n\n  /* =====================================================================\n     TYPE\n     ---------------------------------------------------------------------\n     Three voices, matching the logo composition:\n     - DISPLAY (Sora 700-800) ........ the heavy \"Gig\" voice.\n                                       Headlines, big numbers, hero copy.\n     - BODY    (Manrope 400-600) ..... the utility voice.\n                                       UI, forms, paragraphs, data.\n     - SCRIPT  (Permanent Marker) .... the brushed \"my\" voice.\n                                       Used SPARINGLY — pull-quotes,\n                                       campaign callouts, easter eggs.\n                                       NOT for navigation or buttons.\n     - MONO    (JetBrains Mono) ...... timestamps, IDs, payslips, shift\n                                       codes — anything monospaced.\n     ===================================================================== */\n\n  --font-display: \"Sora\", system-ui, sans-serif;\n  --font-body:    \"Manrope\", system-ui, sans-serif;\n  --font-script:  \"Permanent Marker\", \"Caveat Brush\", cursive;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, monospace;\n\n  /* Size scale — fluid-ish but discrete */\n  --fs-display-xl: 88px;   --lh-display-xl: 0.95;\n  --fs-display-l:  64px;   --lh-display-l:  1.00;\n  --fs-display:    44px;   --lh-display:    1.05;\n  --fs-h1:         36px;   --lh-h1:         1.10;\n  --fs-h2:         28px;   --lh-h2:         1.15;\n  --fs-h3:         22px;   --lh-h3:         1.25;\n  --fs-h4:         18px;   --lh-h4:         1.30;\n  --fs-body:       16px;   --lh-body:       1.50;\n  --fs-body-sm:    14px;   --lh-body-sm:    1.45;\n  --fs-caption:    12px;   --lh-caption:    1.40;\n  --fs-micro:      11px;   --lh-micro:      1.30;\n\n  /* Tracking */\n  --tr-tight:  -0.02em;\n  --tr-snug:   -0.01em;\n  --tr-normal:  0;\n  --tr-wide:    0.04em;\n  --tr-eyebrow: 0.12em;  /* uppercase eyebrows */\n\n  /* =====================================================================\n     SPACING — 4pt grid\n     ===================================================================== */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-8:  32px;\n  --sp-10: 40px;\n  --sp-12: 48px;\n  --sp-16: 64px;\n  --sp-20: 80px;\n  --sp-24: 96px;\n\n  /* =====================================================================\n     RADII — friendly, but not pillowy.\n     Pills used heavily for shift status / category tags.\n     ===================================================================== */\n  --r-xs:    4px;\n  --r-sm:    8px;\n  --r-md:   12px;   /* default for cards, inputs, buttons */\n  --r-lg:   18px;\n  --r-xl:   28px;   /* large hero cards, mobile sheets */\n  --r-pill: 999px;  /* status pills, tags, segmented control */\n\n  /* =====================================================================\n     SHADOW + ELEVATION\n     Inky, soft, low-spread. We don't do bluish elevation.\n     ===================================================================== */\n  --sh-1:  0 1px 2px rgba(14, 13, 11, 0.06),\n           0 1px 1px rgba(14, 13, 11, 0.04);\n  --sh-2:  0 2px 6px rgba(14, 13, 11, 0.08),\n           0 1px 2px rgba(14, 13, 11, 0.05);\n  --sh-3:  0 8px 24px rgba(14, 13, 11, 0.10),\n           0 2px 6px rgba(14, 13, 11, 0.06);\n  --sh-4:  0 20px 48px rgba(14, 13, 11, 0.14),\n           0 6px 14px rgba(14, 13, 11, 0.08);\n\n  /* Hard inky shadow used as a deliberate brand motif on stamps + CTAs */\n  --sh-stamp: 4px 4px 0 var(--ink-900);\n  --sh-stamp-brand: 4px 4px 0 var(--brand-500);\n\n  /* Inner shadow for inset fields */\n  --sh-inset: inset 0 1px 2px rgba(14, 13, 11, 0.06);\n\n  /* =====================================================================\n     MOTION\n     ===================================================================== */\n  --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:   120ms;\n  --dur-base:   200ms;\n  --dur-slow:   400ms;\n\n  /* =====================================================================\n     LAYOUT\n     ===================================================================== */\n  --container-narrow: 720px;\n  --container:       1140px;\n  --container-wide:  1320px;\n  --gutter:           24px;\n\n  /* Borders */\n  --bw-hair: 1px;\n  --bw-rule: 1.5px;\n  --bw-heavy: 2px;\n  --bw-stamp: 3px;\n}\n\n/* ========================================================================\n   SEMANTIC ELEMENT STYLES — drop these in via class on any project\n   ======================================================================== */\n\nhtml, body {\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--ink-700);\n  background: var(--ink-0);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n.mg-display-xl { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-display-xl); line-height: var(--lh-display-xl); letter-spacing: var(--tr-tight); }\n.mg-display-l  { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-display-l);  line-height: var(--lh-display-l);  letter-spacing: var(--tr-tight); }\n.mg-display    { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-display);    line-height: var(--lh-display);    letter-spacing: var(--tr-snug);  }\n.mg-h1         { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h1);         line-height: var(--lh-h1);         letter-spacing: var(--tr-snug);  }\n.mg-h2         { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h2);         line-height: var(--lh-h2);         letter-spacing: var(--tr-snug);  }\n.mg-h3         { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-h3);         line-height: var(--lh-h3); }\n.mg-h4         { font-family: var(--font-body);    font-weight: 700; font-size: var(--fs-h4);         line-height: var(--lh-h4); }\n.mg-body       { font-family: var(--font-body);    font-weight: 400; font-size: var(--fs-body);       line-height: var(--lh-body); }\n.mg-body-sm    { font-family: var(--font-body);    font-weight: 400; font-size: var(--fs-body-sm);    line-height: var(--lh-body-sm); }\n.mg-caption    { font-family: var(--font-body);    font-weight: 500; font-size: var(--fs-caption);    line-height: var(--lh-caption); }\n.mg-eyebrow    { font-family: var(--font-body);    font-weight: 700; font-size: var(--fs-caption);    line-height: 1; letter-spacing: var(--tr-eyebrow); text-transform: uppercase; }\n.mg-mono       { font-family: var(--font-mono);    font-weight: 500; font-size: var(--fs-body-sm); }\n.mg-script     { font-family: var(--font-script);  font-weight: 400; font-size: var(--fs-display);    letter-spacing: var(--tr-normal); }\n\n/* Helpful primitives */\n.mg-stamp-shadow { box-shadow: var(--sh-stamp); border: var(--bw-stamp) solid var(--ink-900); }\n.mg-card         { background: var(--surface-0); border: 1px solid var(--ink-100); border-radius: var(--r-md); box-shadow: var(--sh-1); }\n.mg-card--raised { background: var(--surface-0); border: 1px solid var(--ink-100); border-radius: var(--r-lg); box-shadow: var(--sh-3); }\n<\u002Fstyle>\n<script src=\"e5b5bc05-a3db-40bc-bdb1-6ac93ff1f06f\"><\u002Fscript>\n<style>\n  :root {\n    --slide-pad: 96px;\n  }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--ink-700); font-family: var(--font-body); color: var(--ink-700); }\n\n  deck-stage > section {\n    background: var(--ink-0);\n    padding: var(--slide-pad);\n    color: var(--ink-700);\n    overflow: hidden;\n    position: relative;\n  }\n  section.dark { background: var(--ink-900); color: white; }\n  section.brand-loud { background: var(--brand-500); color: white; }\n  section.brand-soft { background: var(--brand-100); }\n\n  /* Reusable type */\n  .eyebrow {\n    font-family: var(--font-body); font-weight: 700;\n    font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--ink-400);\n  }\n  .dark .eyebrow { color: var(--brand-300); }\n  .brand-loud .eyebrow { color: rgba(255,255,255,0.7); }\n  .brand-soft .eyebrow { color: var(--brand-700); }\n\n  .h-display {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 140px; line-height: 0.92; letter-spacing: -0.025em;\n    color: var(--ink-900); margin: 0;\n  }\n  .dark .h-display { color: white; }\n  .brand-loud .h-display { color: white; }\n  .h-title {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 92px; line-height: 0.98; letter-spacing: -0.022em;\n    color: var(--ink-900); margin: 0;\n  }\n  .dark .h-title { color: white; }\n  .brand-loud .h-title { color: white; }\n  .h-section {\n    font-family: var(--font-display); font-weight: 700;\n    font-size: 64px; line-height: 1.02; letter-spacing: -0.02em;\n    color: var(--ink-900); margin: 0;\n  }\n  .dark .h-section { color: white; }\n  .brand-loud .h-section { color: white; }\n  .lede {\n    font-size: 28px; line-height: 1.4; color: var(--ink-500);\n    max-width: 1100px;\n  }\n  .dark .lede { color: rgba(255,255,255,0.72); }\n  .brand-loud .lede { color: rgba(255,255,255,0.85); }\n  .body-lg { font-size: 22px; line-height: 1.55; color: var(--ink-500); }\n  .dark .body-lg { color: rgba(255,255,255,0.7); }\n  .small { font-size: 18px; line-height: 1.5; color: var(--ink-400); }\n  .dark .small { color: rgba(255,255,255,0.55); }\n  .mono { font-family: var(--font-mono); }\n\n  .script {\n    font-family: var(--font-script); font-weight: 400;\n    color: var(--ink-900); display: inline-block; transform: rotate(-3deg);\n  }\n  .dark .script { color: var(--brand-300); }\n\n  .stack { display: flex; flex-direction: column; gap: 28px; }\n  .row { display: flex; gap: 32px; align-items: center; }\n  .row-stack { display: flex; gap: 56px; align-items: flex-start; }\n\n  .pill {\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 10px 22px; border-radius: 999px;\n    background: var(--ink-900); color: white;\n    font-weight: 700; font-size: 16px;\n  }\n  .dark .pill { background: var(--brand-500); color: white; }\n\n  /* Brand stamp */\n  .stamp {\n    display: inline-flex; align-items: center; gap: 14px;\n    background: var(--brand-500); color: white;\n    border: 5px solid var(--ink-900);\n    box-shadow: 8px 8px 0 var(--ink-900);\n    padding: 18px 32px; border-radius: 16px;\n    font-family: var(--font-display); font-weight: 800; font-size: 28px;\n    line-height: 1;\n  }\n  .stamp.tilt { transform: rotate(-3deg); }\n\n  /* TITLE slide */\n  .title-slide { display: grid; grid-template-rows: 1fr auto; height: 100%; }\n  .title-top { display: flex; justify-content: space-between; align-items: flex-start; }\n  .title-logo { height: 56px; filter: invert(1); }\n  .title-meta { text-align: right; font-size: 16px; color: rgba(255,255,255,0.5); line-height: 1.6; }\n  .title-meta b { color: white; font-weight: 700; }\n  .title-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 48px; }\n  .title-h {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 200px; line-height: 0.9; letter-spacing: -0.03em;\n    color: white; margin: 0;\n  }\n  .title-tag { font-size: 28px; color: rgba(255,255,255,0.7); max-width: 520px; }\n\n  /* Section opener */\n  .section-opener { display: flex; flex-direction: column; justify-content: center; height: 100%; }\n  .section-num {\n    font-family: var(--font-mono); font-weight: 600;\n    font-size: 20px; color: var(--brand-500); letter-spacing: 0.1em;\n    margin-bottom: 32px;\n  }\n  .section-opener .h-section {\n    font-size: 160px; line-height: 0.92;\n  }\n\n  /* COLOR SWATCH */\n  .swatch-grid { display: grid; gap: 16px; }\n  .swatch {\n    background: var(--swatch-bg, white);\n    color: var(--swatch-fg, var(--ink-900));\n    border-radius: 16px; padding: 24px;\n    border: 1.5px solid rgba(0,0,0,0.06);\n    display: flex; flex-direction: column; justify-content: space-between;\n    min-height: 180px;\n  }\n  .swatch .name {\n    font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1;\n  }\n  .swatch .hex {\n    font-family: var(--font-mono); font-weight: 600; font-size: 18px;\n  }\n  .swatch .role { font-size: 14px; opacity: 0.7; margin-top: 4px; }\n\n  /* Type spec */\n  .type-spec { display: flex; flex-direction: column; gap: 8px; padding: 28px 0; border-bottom: 1px solid var(--ink-100); }\n  .type-spec:last-child { border-bottom: none; }\n  .type-spec .label { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-400); display: flex; gap: 16px; }\n  .type-spec .label .mono { color: var(--ink-700); }\n  .type-spec .sample { color: var(--ink-900); }\n\n  /* Component preview frames */\n  .frame {\n    background: var(--surface-0);\n    border: 1.5px solid var(--ink-100);\n    border-radius: 18px;\n    box-shadow: 0 18px 48px rgba(14,13,11,0.08);\n    overflow: hidden;\n  }\n\n  /* Buttons row */\n  .btn {\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 18px 32px; border-radius: 14px;\n    font-family: var(--font-body); font-weight: 700; font-size: 22px;\n    cursor: pointer; border: none; line-height: 1;\n  }\n  .btn-primary { background: var(--brand-500); color: white; border: 4px solid var(--ink-900); box-shadow: 6px 6px 0 var(--ink-900); padding: 18px 32px; }\n  .btn-secondary { background: var(--ink-900); color: white; }\n  .btn-ghost { background: white; color: var(--ink-900); border: 2px solid var(--ink-100); }\n\n  /* Shift card mini */\n  .shift-card {\n    background: white; border: 1.5px solid var(--ink-100); border-radius: 20px;\n    padding: 28px; box-shadow: 0 8px 24px rgba(14,13,11,0.06);\n  }\n  .shift-card .row { justify-content: space-between; align-items: flex-start; }\n  .shift-card .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: #FFD6A8; border-radius: 999px; font-weight: 700; font-size: 16px; }\n  .shift-card .tag .dot { width: 8px; height: 8px; background: var(--ink-900); border-radius: 50%; }\n  .shift-card .title { font-family: var(--font-display); font-weight: 700; font-size: 32px; color: var(--ink-900); line-height: 1.1; margin-top: 12px; }\n  .shift-card .meta { font-family: var(--font-mono); font-size: 18px; color: var(--ink-500); margin-top: 12px; font-weight: 600; }\n  .shift-card .pay { text-align: right; }\n  .shift-card .pay .amt { font-family: var(--font-display); font-weight: 800; font-size: 56px; color: var(--ink-900); line-height: 1; }\n  .shift-card .pay .rate { font-size: 18px; color: var(--ink-400); margin-top: 4px; }\n  .shift-card .divider { height: 1px; background: var(--ink-50); margin: 22px 0; }\n  .shift-card .cta-row { display: flex; justify-content: space-between; align-items: center; }\n  .shift-card .secure {\n    background: var(--brand-500); color: white;\n    border: 3px solid var(--ink-900); border-radius: 12px;\n    padding: 14px 28px; font-family: var(--font-body); font-weight: 800; font-size: 20px;\n    box-shadow: 4px 4px 0 var(--ink-900);\n  }\n\n  /* Stats grid */\n  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }\n  .stat .num {\n    font-family: var(--font-display); font-weight: 800;\n    font-size: 140px; line-height: 0.9; letter-spacing: -0.03em;\n    color: var(--ink-900);\n  }\n  .stat .label {\n    font-size: 22px; font-weight: 600; color: var(--ink-900);\n    max-width: 280px; line-height: 1.35; margin-top: 12px;\n  }\n\n  /* Voice DO/DONT */\n  .vc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }\n  .vc-col h4 { font-family: var(--font-display); font-weight: 700; font-size: 28px; margin: 0 0 20px; display: flex; align-items: center; gap: 12px; }\n  .vc-col .icon { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }\n  .vc-col.do .icon { background: var(--brand-500); color: white; border: 3px solid var(--ink-900); }\n  .vc-col.dont .icon { background: var(--ink-900); color: white; }\n  .vc-item {\n    padding: 22px 24px; border-radius: 14px; background: white;\n    border: 1.5px solid var(--ink-100); margin-bottom: 14px;\n    font-size: 22px; line-height: 1.45; color: var(--ink-700);\n  }\n  .vc-item.bad { text-decoration: line-through; color: var(--ink-400); }\n\n  /* Logo lockup */\n  .logo-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: stretch; }\n  .logo-tile {\n    border-radius: 24px; padding: 56px;\n    display: flex; align-items: center; justify-content: center;\n    border: 1.5px solid var(--ink-100);\n    min-height: 320px;\n  }\n  .logo-tile.light { background: var(--surface-0); }\n  .logo-tile.dark { background: var(--ink-900); border-color: var(--ink-900); }\n  .logo-tile img { max-width: 80%; height: auto; max-height: 160px; }\n\n  /* Final */\n  .final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; height: 100%; }\n  .next-list { display: flex; flex-direction: column; gap: 18px; }\n  .next-item { display: flex; gap: 16px; align-items: flex-start; }\n  .next-item .num { font-family: var(--font-mono); color: var(--brand-500); font-weight: 700; font-size: 18px; min-width: 32px; padding-top: 4px; }\n  .next-item .text { color: white; font-size: 22px; line-height: 1.4; }\n  .next-item .text b { font-family: var(--font-display); font-weight: 700; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<deck-stage>\n\n  <!-- ============ 1. TITLE ============ -->\n  <section class=\"dark\" data-screen-label=\"01 Title\">\n    <div class=\"title-slide\">\n      <div class=\"title-top\">\n        <img src=\"2d167375-ed8c-47a1-8e25-e2c40dbcaa1c\" alt=\"MyGig\" class=\"title-logo\">\n        <div class=\"title-meta\">\n          <b>Design System · v1<\u002Fb><br>\n          Prepared for review<br>\n          23 May 2026\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"title-bottom\">\n        <h1 class=\"title-h\">\n          Work your <span class=\"script\" style=\"font-size:0.7em;\">Way.<\u002Fspan>\n        <\u002Fh1>\n        <div class=\"title-tag\">\n          The brand, voice, and product UI for Australia's AI-powered Workforce-as-a-Service.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 2. WHAT MYGIG IS ============ -->\n  <section data-screen-label=\"02 What MyGig is\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">A workforce platform, not a job board.<\u002Fdiv>\n      <h2 class=\"h-title\">We're the<br>Employer of Record.<\u002Fh2>\n      <p class=\"lede\" style=\"max-width:1300px;\">\n        Businesses post shifts. Vetted workers secure them. MyGig handles payroll, super, workers comp, and award interpretation — across hospitality, warehousing, events, retail, construction, agriculture, and mining.\n      <\u002Fp>\n      <div style=\"display:flex; gap:16px; margin-top:24px;\">\n        <span class=\"pill\">For businesses · the platform<\u002Fspan>\n        <span class=\"pill\">For workers · the mobile app<\u002Fspan>\n        <span class=\"pill\">For everyone · the marketing site<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 3. THE BIG IDEA ============ -->\n  <section class=\"dark\" data-screen-label=\"03 The big idea\">\n    <div class=\"stack\" style=\"max-width: 1500px;\">\n      <div class=\"eyebrow\">The big idea<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"font-size: 120px;\">\n        Human grit<br>\n        meets <span style=\"color: var(--brand-500);\">confident systems.<\u002Fspan>\n      <\u002Fh2>\n      <p class=\"lede\" style=\"max-width:1200px;\">\n        The MyGig wordmark sets the whole system: a <i>hand-painted \"my\"<\u002Fi> sitting next to a <b>bold geometric \"Gig\"<\u002Fb>. Every visual decision lands somewhere on that spectrum.\n      <\u002Fp>\n      <div style=\"margin-top:48px; background:white; padding:64px; border-radius:24px; display:flex; justify-content:center;\">\n        <img src=\"b52f2efc-2d13-4353-9dba-30e81ef2c96a\" alt=\"MyGig wordmark\" style=\"height:140px;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 4. SECTION — COLOUR ============ -->\n  <section class=\"brand-loud\" data-screen-label=\"04 Section — Colour\">\n    <div class=\"section-opener\">\n      <div class=\"section-num\" style=\"color:white;\">PART 01 — FOUNDATIONS<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"font-size: 220px;\">Colour.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:32px; max-width:1200px;\">\n        Three commitments: deep off-true black, the MyGig violet, warm paper. No gradients. No corporate blue.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 5. COLOUR — THE THREE ============ -->\n  <section data-screen-label=\"05 Colour — the three\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">The three commitments<\u002Fdiv>\n      <h2 class=\"h-section\">A palette borrowed<br>from the worksite.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top:32px;\">\n        <div class=\"swatch\" style=\"--swatch-bg: #0E0D0B; --swatch-fg: white;\">\n          <div>\n            <div class=\"eyebrow\" style=\"color: rgba(255,255,255,0.5); margin-bottom:8px;\">Ink<\u002Fdiv>\n            <div class=\"name\">Brand black<\u002Fdiv>\n            <div class=\"role\" style=\"margin-top:6px;\">The wordmark black. Never pure #000. Primary surface, type.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hex\">#0E0D0B<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"swatch\" style=\"--swatch-bg: #6C60FF; --swatch-fg: white;\">\n          <div>\n            <div class=\"eyebrow\" style=\"margin-bottom:8px; color: rgba(255,255,255,0.7);\">Brand violet<\u002Fdiv>\n            <div class=\"name\">Signature accent<\u002Fdiv>\n            <div class=\"role\" style=\"margin-top:6px; opacity:0.85;\">Pulled straight from mygig.com.au. Used confidently — CTAs, key brand moments, info chips. White text reads on top.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hex\">#6C60FF<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"swatch\" style=\"--swatch-bg: #FAF8F4;\">\n          <div>\n            <div class=\"eyebrow\" style=\"margin-bottom:8px;\">Paper<\u002Fdiv>\n            <div class=\"name\">App background<\u002Fdiv>\n            <div class=\"role\" style=\"margin-top:6px;\">Warm off-white, not cool grey. Gives every screen a tiny analog feel.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"hex\">#FAF8F4<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 6. COLOUR — SCALES ============ -->\n  <section data-screen-label=\"06 Colour — full scales\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">Full scales<\u002Fdiv>\n      <h2 class=\"h-section\">Ink &amp; Brand, in 6+ steps.<\u002Fh2>\n\n      <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:24px;\">\n        <div class=\"eyebrow\" style=\"color:var(--ink-700);\">Ink<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns: repeat(8, 1fr); gap:12px;\">\n          <div style=\"height:140px; background:#FAF8F4; border-radius:12px; border:1px solid var(--ink-100); padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-0<\u002Fspan><span class=\"mono\" style=\"font-size:13px; color:var(--ink-400);\">#FAF8F4<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#F2EFE8; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-50<\u002Fspan><span class=\"mono\" style=\"font-size:13px; color:var(--ink-400);\">#F2EFE8<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#E5E1D7; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-100<\u002Fspan><span class=\"mono\" style=\"font-size:13px; color:var(--ink-700);\">#E5E1D7<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#CFC9BA; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-200<\u002Fspan><span class=\"mono\" style=\"font-size:13px;\">#CFC9BA<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#A8A294; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-300<\u002Fspan><span class=\"mono\" style=\"font-size:13px;\">#A8A294<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#6F6A60; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-400<\u002Fspan><span class=\"mono\" style=\"font-size:13px; opacity:0.8;\">#6F6A60<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#3D3A33; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-500<\u002Fspan><span class=\"mono\" style=\"font-size:13px; opacity:0.8;\">#3D3A33<\u002Fspan><\u002Fdiv>\n          <div style=\"height:140px; background:#0E0D0B; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">ink-900<\u002Fspan><span class=\"mono\" style=\"font-size:13px; opacity:0.7;\">#0E0D0B<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:8px;\">\n        <div class=\"eyebrow\" style=\"color:var(--ink-700);\">Brand · the MyGig violet<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns: repeat(6, 1fr); gap:12px;\">\n          <div style=\"height:120px; background:#F5F4FE; border-radius:12px; border:1px solid var(--ink-100); padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-50<\u002Fspan><span class=\"mono\" style=\"font-size:13px; color:var(--ink-400);\">#F5F4FE<\u002Fspan><\u002Fdiv>\n          <div style=\"height:120px; background:#E8E6F9; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-100<\u002Fspan><span class=\"mono\" style=\"font-size:13px; color:var(--ink-400);\">#E8E6F9<\u002Fspan><\u002Fdiv>\n          <div style=\"height:120px; background:#B8B1F7; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-300<\u002Fspan><span class=\"mono\" style=\"font-size:13px;\">#B8B1F7<\u002Fspan><\u002Fdiv>\n          <div style=\"height:120px; background:#6C60FF; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-500<\u002Fspan><span class=\"mono\" style=\"font-size:13px;\">#6C60FF<\u002Fspan><\u002Fdiv>\n          <div style=\"height:120px; background:#4B3FD9; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-700<\u002Fspan><span class=\"mono\" style=\"font-size:13px;\">#4B3FD9<\u002Fspan><\u002Fdiv>\n          <div style=\"height:120px; background:#2D2580; color:white; border-radius:12px; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\"><span style=\"font-weight:700; font-size:16px;\">brand-900<\u002Fspan><span class=\"mono\" style=\"font-size:13px; opacity:0.8;\">#2D2580<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 7. SECTION — TYPE ============ -->\n  <section class=\"dark\" data-screen-label=\"07 Section — Type\">\n    <div class=\"section-opener\">\n      <div class=\"section-num\">PART 02 — FOUNDATIONS<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"font-size: 220px;\">Type.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:32px; max-width:1200px;\">\n        Three voices that mirror the wordmark composition.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 8. TYPE SPECS ============ -->\n  <section data-screen-label=\"08 Type specs\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">Three voices, one wordmark.<\u002Fdiv>\n      <h2 class=\"h-section\">A heavy display, a workhorse body,<br>a brushed accent.<\u002Fh2>\n\n      <div style=\"margin-top:24px;\">\n        <div class=\"type-spec\">\n          <div class=\"label\">DISPLAY <span class=\"mono\">— Sora 700/800<\u002Fspan> <span style=\"margin-left:auto; color:var(--ink-400);\">The \"Gig\" voice. Hero, big numbers.<\u002Fspan><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family:var(--font-display); font-weight:800; font-size: 88px; line-height: 0.95; letter-spacing:-0.025em;\">Post a shift in 60 seconds.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"type-spec\">\n          <div class=\"label\">BODY <span class=\"mono\">— Manrope 400/500/600/700<\u002Fspan> <span style=\"margin-left:auto; color:var(--ink-400);\">UI, paragraphs, data.<\u002Fspan><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family:var(--font-body); font-weight:500; font-size: 36px; line-height: 1.4; color: var(--ink-500);\">Every worker is verified across 30+ data points, including skills, certifications, and work history.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"type-spec\">\n          <div class=\"label\">SCRIPT <span class=\"mono\">— Permanent Marker<\u002Fspan> <span style=\"margin-left:auto; color:var(--ink-400);\">The \"my\" voice. Hero only — never UI.<\u002Fspan><\u002Fdiv>\n          <div class=\"sample\" style=\"font-family:var(--font-script); font-size: 80px; line-height: 1; transform:rotate(-3deg); display:inline-block;\">Work your Way<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"type-spec\">\n          <div class=\"label\">MONO <span class=\"mono\">— JetBrains Mono<\u002Fspan> <span style=\"margin-left:auto; color:var(--ink-400);\">Shift IDs, timestamps, payslip lines.<\u002Fspan><\u002Fdiv>\n          <div class=\"sample mono\" style=\"font-size:30px; font-weight:600;\">MG-2026-04823 · 6:30am–2:00pm · $31.19/hr<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 9. SECTION — VOICE ============ -->\n  <section class=\"brand-loud\" data-screen-label=\"09 Section — Voice\">\n    <div class=\"section-opener\">\n      <div class=\"section-num\" style=\"color:white;\">PART 03 — FOUNDATIONS<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"font-size: 220px;\">Voice.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:32px; max-width:1200px;\">\n        Plain-spoken Aussie. Confident. Evidence-led.<br>Talk like a competent ops manager who respects the worker on the floor.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 10. VOICE DO/DONT ============ -->\n  <section data-screen-label=\"10 Voice — do / don't\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">What we sound like<\u002Fdiv>\n      <h2 class=\"h-section\">Concrete &gt; clever.<br>Numbers &gt; adjectives.<\u002Fh2>\n\n      <div class=\"vc-grid\" style=\"margin-top:24px;\">\n        <div class=\"vc-col do\">\n          <h4><span class=\"icon\">✓<\u002Fspan> Do<\u002Fh4>\n          <div class=\"vc-item\">\"Post a shift in under 60 seconds.\"<\u002Fdiv>\n          <div class=\"vc-item\">\"We're the Employer of Record — we take the legal weight, you get the workers.\"<\u002Fdiv>\n          <div class=\"vc-item\">\"Get paid the day after your shift.\"<\u002Fdiv>\n          <div class=\"vc-item\">\"Top workers get first dibs on shifts.\"<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"vc-col dont\">\n          <h4><span class=\"icon\">✕<\u002Fspan> Don't<\u002Fh4>\n          <div class=\"vc-item bad\">\"Streamline your workforce procurement journey.\"<\u002Fdiv>\n          <div class=\"vc-item bad\">\"We provide an EOR layer.\"<\u002Fdiv>\n          <div class=\"vc-item bad\">\"Optimised payout cadences.\"<\u002Fdiv>\n          <div class=\"vc-item bad\">\"Premium-tier operatives receive prioritised allocation.\"<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 11. SECTION — SYSTEM ============ -->\n  <section class=\"dark\" data-screen-label=\"11 Section — System\">\n    <div class=\"section-opener\">\n      <div class=\"section-num\">PART 04 — IN PRODUCT<\u002Fdiv>\n      <h2 class=\"h-section\" style=\"font-size: 220px;\">System.<\u002Fh2>\n      <p class=\"lede\" style=\"margin-top:32px; max-width:1200px;\">\n        Tokens, components, motifs — how the foundations turn into shipped UI.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 12. COMPONENTS ============ -->\n  <section data-screen-label=\"12 Components\">\n    <div class=\"stack\">\n      <div class=\"eyebrow\">Components<\u002Fdiv>\n      <h2 class=\"h-section\">Buttons, pills, and the<br>stamp motif.<\u002Fh2>\n\n      <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap:32px; margin-top:32px;\">\n\n        <div class=\"frame\" style=\"padding:40px;\">\n          <div class=\"eyebrow\" style=\"color:var(--ink-400); margin-bottom:24px;\">Buttons<\u002Fdiv>\n          <div style=\"display:flex; gap:18px; flex-wrap:wrap; align-items:center;\">\n            <button class=\"btn btn-primary\">Post a shift<\u002Fbutton>\n            <button class=\"btn btn-secondary\">Cancel<\u002Fbutton>\n            <button class=\"btn btn-ghost\">Save draft<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"small\" style=\"margin-top:24px;\">Primary uses the stamp motif — violet fill + 4px ink border + offset shadow.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"frame\" style=\"padding:40px;\">\n          <div class=\"eyebrow\" style=\"color:var(--ink-400); margin-bottom:24px;\">Status pills<\u002Fdiv>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap;\">\n            <span style=\"display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:#E8F6EE; color:#135E33; border-radius:999px; font-weight:700; font-size:18px;\"><span style=\"width:10px; height:10px; background:#1F8A4C; border-radius:50%;\"><\u002Fspan>Confirmed<\u002Fspan>\n            <span style=\"display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:#E8E6F9; color:#0E0D0B; border-radius:999px; font-weight:700; font-size:18px;\"><span style=\"width:10px; height:10px; background:#4B3FD9; border-radius:50%;\"><\u002Fspan>Open<\u002Fspan>\n            <span style=\"display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:#FFF3DC; color:#8A5A00; border-radius:999px; font-weight:700; font-size:18px;\"><span style=\"width:10px; height:10px; background:#E89B14; border-radius:50%;\"><\u002Fspan>Cert expiring<\u002Fspan>\n            <span style=\"display:inline-flex; align-items:center; gap:10px; padding:10px 20px; background:#0E0D0B; color:white; border-radius:999px; font-weight:700; font-size:18px;\">★ Top worker<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"small\" style=\"margin-top:24px;\">Pills are a signature — used heavily for shift state, certs, worker tier.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"frame\" style=\"padding:48px; margin-top:8px;\">\n        <div class=\"eyebrow\" style=\"color:var(--ink-400); margin-bottom:24px;\">Stamp motif — a deliberate brand moment<\u002Fdiv>\n        <div style=\"display:flex; gap:40px; align-items:center;\">\n          <div class=\"stamp tilt\">90%+ FILL RATE<\u002Fdiv>\n          <div style=\"background:var(--ink-900); border:5px solid var(--ink-900); box-shadow:8px 8px 0 var(--brand-500); padding:18px 32px; border-radius:16px; display:inline-flex; flex-direction:column; align-items:center; gap:4px; transform:rotate(2deg);\">\n            <span style=\"font-fam
