<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 854px; overflow: hidden; }
  .tile { width: 1280px; height: 854px; display: flex; }
  .main { flex: 1; background: #6C60FF; display: flex; align-items: center; justify-content: center; }
  .main img { width: 62%; height: auto; display: block; }
  .strip { width: 300px; height: 854px; display: flex; flex-direction: column; }
  .strip div { flex: 1; }
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logo-wordmark-white.png" alt="MyGig"></div>
  <div class="strip">
    <div style="background:#E89B14;"></div>
    <div style="background:#1F8A4C;"></div>
    <div style="background:#2563C8;"></div>
    <div style="background:#2D2580;"></div>
  </div>
</div>
</body>
</html>
